<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex-container">
        <h1 class="fontsGeneral">Rock Paper Scissors Game</h1>
        <div id="centerDiv">
            <div id="playerSide">
                <h2 class="fontsGeneral">Your Choice</h2>
                <button id="rockBtn"><image src="src/rock.png" width="50"></image></button>
                <button id="paperBtn"><image src="src/Paper.png" width="50"></image></button>
                <button id="scissorsBtn"><image src="src/scissors.png" width="50"></image></button>
            </div>
            <div id="vsPanel">
                <h2 id="vs">VS</h2>
            </div>
            <div class="fontsGeneral" id="computerSide">
                <h2>Computer Choice</h2>
            </div>
        </div>
        <h2 id="winnerBox"></h2>
    </div>
    <script src="script.js"></script>

</body>
</html>
